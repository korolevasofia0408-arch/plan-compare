<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Доступ по паролю</title>
<style>
:root{--bg:#EEF3EE;--surface:#fff;--ink:#12281B;--muted:#5A6D60;--line:#D5DFD6;--soft:#E4ECE5;--leaf:#2E7D4F;--bad:#B3261E}
@media (prefers-color-scheme: dark){:root{--bg:#0C1611;--surface:#14241B;--ink:#E7F1E8;--muted:#97AB9C;--line:#25382C;--soft:#1B2E23;--leaf:#4DBA82;--bad:#FF8A80}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,'Segoe UI',sans-serif;padding:16px}
form{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px;box-shadow:0 8px 24px -12px rgba(18,40,27,.18)}
h1{font-size:19px;margin:0 0 6px}
p{margin:0 0 16px;color:var(--muted);font-size:14px}
input[type=password]{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
input[type=password]:focus{outline:2px solid var(--leaf);outline-offset:1px}
label{display:flex;gap:8px;align-items:center;margin:12px 0 16px;font-size:13.5px;color:var(--muted);cursor:pointer}
button{width:100%;padding:10px 14px;border:0;border-radius:999px;background:var(--leaf);color:#fff;font:600 15px system-ui,-apple-system,'Segoe UI',sans-serif;cursor:pointer}
button[disabled]{opacity:.6;cursor:wait}
#err{color:var(--bad);font-size:13.5px;min-height:20px;margin:10px 0 0}
</style>
</head>
<body>
<form id="f" autocomplete="off">
 <h1>Введите пароль</h1>
 <p>Страница открывается только по паролю.</p>
 <input id="pw" type="password" aria-label="Пароль" placeholder="Пароль" required>
 <label><input id="rem" type="checkbox" checked> Запомнить на этом устройстве</label>
 <button id="go" type="submit">Открыть</button>
 <div id="err" role="alert"></div>
</form>

const KEY='plan-compare-pw';
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(pw){
 const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
 const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(P.s),iterations:P.n,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
 const buf=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.i)},key,b64(P.d));
 return new TextDecoder().decode(buf)}
function show(html){document.open();document.write(html);document.close()}
const f=document.getElementById('f'),pw=document.getElementById('pw'),go=document.getElementById('go'),err=document.getElementById('err'),rem=document.getElementById('rem');
f.addEventListener('submit',async e=>{e.preventDefault();err.textContent='';go.disabled=true;go.textContent='Открываю…';
 try{const html=await unlock(pw.value);try{if(rem.checked)localStorage.setItem(KEY,pw.value);else localStorage.removeItem(KEY)}catch(x){}show(html)}
 catch(x){err.textContent='Неверный пароль';go.disabled=false;go.textContent='Открыть';pw.select()}});
(async()=>{let s=null;try{s=localStorage.getItem(KEY)}catch(x){}
 if(!s){pw.focus();return}
 go.disabled=true;go.textContent='Открываю…';
 try{show(await unlock(s))}catch(x){try{localStorage.removeItem(KEY)}catch(y){}go.disabled=false;go.textContent='Открыть';pw.focus()}})();
</script>
